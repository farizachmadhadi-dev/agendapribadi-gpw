<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Pribadi - Multi PIN</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col items-center justify-start p-4">

    <!-- Modal / Screen Masukkan PIN -->
    <div id="lockScreen" class="fixed inset-0 bg-slate-900 bg-opacity-75 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 text-center">
            <h2 class="text-xl font-bold mb-2">Masukan PIN Agenda</h2>
            <p class="text-sm text-slate-500 mb-4">Masukkan PIN Anda untuk membuka agenda pribadi.</p>
            <input type="password" id="pinInput" maxlength="6" class="w-full text-center tracking-widest text-2xl py-2 border border-slate-300 rounded-xl mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="••••">
            <button onclick="loginUser()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-xl transition">Buka Agenda</button>
            <p id="pinError" class="text-red-500 text-xs mt-2 hidden">PIN tidak terdaftar!</p>
        </div>
    </div>

    <!-- Konten Utama Aplikasi -->
    <div class="w-full max-w-md bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
        <header class="flex justify-between items-center mb-6 border-b pb-4">
            <div>
                <h1 class="text-lg font-bold">📅 Agenda Pribadi</h1>
                <span id="userSessionLabel" class="text-xs text-slate-500 font-medium"></span>
            </div>
            <button onclick="logout()" class="text-xs bg-red-100 text-red-600 font-medium px-3 py-1.5 rounded-lg hover:bg-red-200 transition">Keluar</button>
        </header>

        <!-- Form Tambah Agenda -->
        <div class="space-y-4 mb-6">
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Tanggal & Waktu</label>
                <input type="datetime-local" id="agendaDate" class="w-full text-sm p-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Keterangan Agenda</label>
                <textarea id="agendaText" rows="2" class="w-full text-sm p-2.5 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Tulis rencana kegiatan..."></textarea>
            </div>
            <button onclick="addAgenda()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-2.5 rounded-xl text-sm transition">Simpan Agenda</button>
        </div>

        <!-- Daftar Agenda -->
        <div>
            <h2 class="text-sm font-bold text-slate-700 mb-3">Daftar Agenda</h2>
            <div id="agendaList" class="space-y-2.5 max-h-64 overflow-y-auto pr-1">
                <p class="text-xs text-slate-400 text-center py-4">Memuat data...</p>
            </div>
        </div>
    </div>

    <script>
        // Konfigurasi Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDQAhMUUqVzAOUAdhHksZ6PgOPaXiJuC7o",
            authDomain: "agendapribadi.firebaseapp.com",
            databaseURL: "https://agendapribadi-default-rtdb.firebaseio.com",
            projectId: "agendapribadi",
            storageBucket: "agendapribadi.firebasestorage.app",
            messagingSenderId: "62329882460",
            appId: "1:62329882460:web:34652e2be70e971710a399"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Daftar PIN dan Nama Pengguna
        const users = {
            "1111": { name: "Agenda Si A", path: "user_a" },
            "2222": { name: "Agenda Si B", path: "user_b" }
        };

        let currentUserPath = null;

        // Cek apakah sebelumnya sudah login di browser ini
        window.onload = function() {
            const savedPath = localStorage.getItem('active_user_path');
            const savedName = localStorage.getItem('active_user_name');
            if (savedPath && savedName) {
                currentUserPath = savedPath;
                document.getElementById('userSessionLabel').innerText = savedName;
                document.getElementById('lockScreen').classList.add('hidden');
                loadAgendas();
            }
        };

        function loginUser() {
            const enteredPin = document.getElementById('pinInput').value;
            if (users[enteredPin]) {
                const user = users[enteredPin];
                currentUserPath = user.path;
                
                // Simpan sesi di browser perangkat ini
                localStorage.setItem('active_user_path', user.path);
                localStorage.setItem('active_user_name', user.name);

                document.getElementById('userSessionLabel').innerText = user.name;
                document.getElementById('lockScreen').classList.add('hidden');
                document.getElementById('pinError').classList.add('hidden');
                document.getElementById('pinInput').value = '';
                loadAgendas();
            } else {
                document.getElementById('pinError').classList.remove('hidden');
            }
        }

        function logout() {
            localStorage.removeItem('active_user_path');
            localStorage.removeItem('active_user_name');
            location.reload();
        }

        function addAgenda() {
            const date = document.getElementById('agendaDate').value;
            const text = document.getElementById('agendaText').value;

            if (!date || !text) {
                alert('Mohon isi tanggal dan keterangan agenda!');
                return;
            }

            const newAgendaRef = db.ref('agendapribadi/' + currentUserPath + '/items').push();
            newAgendaRef.set({
                date: date,
                text: text,
                createdAt: Date.now()
            }, (error) => {
                if (!error) {
                    document.getElementById('agendaDate').value = '';
                    document.getElementById('agendaText').value = '';
                } else {
                    alert('Gagal menyimpan: ' + error.message);
                }
            });
        }

        function loadAgendas() {
            const agendaListRef = db.ref('agendapribadi/' + currentUserPath + '/items');
            agendaListRef.on('value', (snapshot) => {
                const container = document.getElementById('agendaList');
                container.innerHTML = '';
                
                const data = snapshot.val();
                if (!data) {
                    container.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">Belum ada agenda.</p>';
                    return;
                }

                Object.keys(data).forEach((key) => {
                    const item = data[key];
                    const card = document.createElement('div');
                    card.className = 'p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs flex justify-between items-start';
                    card.innerHTML = `
                        <div>
                            <span class="font-semibold text-blue-600 block mb-1">${item.date.replace('T', ' ')}</span>
                            <p class="text-slate-700 whitespace-pre-wrap">${item.text}</p>
                        </div>
                        <button onclick="deleteAgenda('${key}')" class="text-red-400 hover:text-red-600 font-bold ml-2">✕</button>
                    `;
                    container.appendChild(card);
                });
            });
        }

        function deleteAgenda(key) {
            if (confirm('Hapus agenda ini?')) {
                db.ref('agendapribadi/' + currentUserPath + '/items/' + key).remove();
            }
        }
    </script>
</body>
</html>
